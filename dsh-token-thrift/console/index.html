<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 节流 · 控制台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <h1>Token 节流</h1>
  <p class="sub">dsh-token-thrift —— 花得聪明，而不只是卡住上限</p>
  <div class="bar-right">
    <button id="fullpower" class="fullpower" title="把力度归零：不劝、不遮、不占一个 token">
      <span class="fp-dot"></span><b>全力工作</b>
    </button>
    <div class="state" id="state">
      <span class="dot" id="dot"></span>
      <span id="state-text">连接中…</span>
    </div>
  </div>
</header>

<main>
  <section class="card wide">
    <h2>力度 <span class="count">0–100 · 拖到哪儿，下面立刻显示那一刻它会说什么</span></h2>
    <div class="dial" id="dial">
      <div class="dial-head">
        <b id="dial-value">—</b>
        <span id="dial-words"></span>
      </div>
      <input type="range" id="dial-range" min="0" max="100" step="1" aria-label="节流力度">
      <div class="dial-ticks" id="dial-ticks"></div>
    </div>
    <div class="configured" id="configured"></div>

    <div class="row sim">
      <span class="sim-label">如果烧到</span>
      <input type="number" id="sim" min="0" max="400" step="1" placeholder="—">
      <span class="sim-label">%</span>
      <button id="sim-clear">用现在的</button>
      <span class="sim-note" id="sim-note"></span>
    </div>
    <div id="ladder" class="ladder"></div>
    <div class="maskline" id="maskline"></div>
  </section>

  <section class="card wide">
    <h2>预算</h2>
    <p class="hint">这个 token 数就是 100%。0 表示关闭。</p>
    <div class="row">
      <input type="number" id="budget" min="0" step="100000" placeholder="2000000">
      <button id="apply" class="primary">应用</button>
      <button id="restore">恢复配置</button>
      <span class="configured" id="configured-budget"></span>
    </div>
  </section>

  <section class="card wide">
    <h2>当前会话</h2>
    <div id="current" class="current empty">还没有会话在花 token。</div>
  </section>

  <section class="card wide">
    <h2>全部会话 <span class="count" id="count"></span></h2>
    <div id="sessions" class="sessions"></div>
  </section>

  <section class="card wide">
    <h2>状态接口</h2>
    <p class="hint">面板和这个页面读的是同一个接口。展开可以看原始 JSON。</p>
    <details>
      <summary>GET /dsh-token-thrift/api/state</summary>
      <pre id="raw"></pre>
    </details>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
